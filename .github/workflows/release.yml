name: Package PrivacyToolkit release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.2.2"
        required: true
        default: "v2.2.1"
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      github.event.head_commit.message == 'Prepare PrivacyToolkit v2.2.1 release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Choose release tag
        id: release_meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_NAME="$INPUT_TAG"
            PRERELEASE="$INPUT_PRERELEASE"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
            PRERELEASE="false"
          else
            TAG_NAME="v2.2.1"
            PRERELEASE="true"
          fi
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG_NAME"
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Build installable source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package/privacytoolkit
          cp src/userplugins/privacytoolkit/index.tsx dist/package/privacytoolkit/
          cp src/userplugins/privacytoolkit/styles.css dist/package/privacytoolkit/
          cp README.md CHANGELOG.md LICENSE dist/package/
          cd dist/package
          zip -qr "$GITHUB_WORKSPACE/dist/privacytoolkit.zip" .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
          PRERELEASE: ${{ steps.release_meta.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG_NAME" "$GITHUB_WORKSPACE/dist/privacytoolkit.zip" \
            --target "$GITHUB_SHA" \
            --title "PrivacyToolkit $TAG_NAME" \
            --generate-notes \
            "${release_flags[@]}"
