name: Test and package PrivacyToolkit release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.5.0"
        required: true
        default: "v2.4.0"
        type: string
      prerelease:
        description: "Mark this tester build as a pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      (github.ref_type == 'branch' && github.event.head_commit.message == 'Prepare PrivacyToolkit v2.4.0 release')
    runs-on: ubuntu-latest
    steps:
      - name: Check out PrivacyToolkit
        uses: actions/checkout@v4

      - name: Check out current Vencord
        uses: actions/checkout@v4
        with:
          repository: Vendicated/Vencord
          ref: main
          path: vencord

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vencord/pnpm-lock.yaml

      - name: Install Vencord dependencies
        working-directory: vencord
        run: pnpm install --frozen-lockfile

      - name: Install PrivacyToolkit into the test checkout
        run: |
          mkdir -p vencord/src/userplugins/privacytoolkit
          cp src/userplugins/privacytoolkit/* vencord/src/userplugins/privacytoolkit/

      - name: Type-check Vencord with PrivacyToolkit
        working-directory: vencord
        run: pnpm test:ts

      - name: Build Vencord with PrivacyToolkit
        working-directory: vencord
        run: pnpm build

      - name: Choose release tag
        id: release_meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_NAME="$INPUT_TAG"
            PRERELEASE="$INPUT_PRERELEASE"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
            if [[ "$TAG_NAME" == "v2.4.0" ]]; then PRERELEASE="true"; else PRERELEASE="false"; fi
          else
            TAG_NAME="v2.5.0"
            PRERELEASE="true"
          fi
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG_NAME"
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Build installable source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package/privacytoolkit
          cp src/userplugins/privacytoolkit/index.tsx dist/package/privacytoolkit/
          cp src/userplugins/privacytoolkit/imageGuard.tsx dist/package/privacytoolkit/
          cp src/userplugins/privacytoolkit/styles.css dist/package/privacytoolkit/
          cp README.md CHANGELOG.md LICENSE dist/package/
          cd dist/package
          zip -qr "$GITHUB_WORKSPACE/dist/privacytoolkit.zip" .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
          PRERELEASE: ${{ steps.release_meta.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$PRERELEASE" == "true" ]]; then release_flags+=(--prerelease); fi
          gh release create "$TAG_NAME" "$GITHUB_WORKSPACE/dist/privacytoolkit.zip" \
            --target "$GITHUB_SHA" \
            --title "PrivacyToolkit $TAG_NAME" \
            --generate-notes \
            "${release_flags[@]}"
